name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Run visual baselines job (usually local-only)"
        type: boolean
        default: false

# Billing guard (Nov 2026): private-repo Actions minutes are capped at the
# 2,000/month free allowance. Matrix jobs on macOS bill at 10x and Windows
# at 2x, so the web and e2e matrices are Linux-only now. The full three-OS
# matrix only makes sense in release.yml, which runs on a tag you cut
# deliberately.

jobs:
  # The web shell is shared, but cross-OS matrix runs bill macOS at 10x and
  # Windows at 2x on every push. Linux-only here; the other OSes are covered
  # in release.yml when you cut a tag.
  web:
    name: lint · typecheck · test · build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:web
      - run: npm run build:mcp
      - run: npm audit --audit-level=high

  desktop:
    name: tauri desktop build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux WebKit / GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            lintian desktop-file-utils appstream xvfb xauth shellcheck
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build:desktop
      - name: Debian package policy checks
        run: ./scripts/check-deb.sh
      - name: Install and launch the package
        run: ./scripts/smoke-deb.sh "$(find apps/desktop/src-tauri/target/release/bundle/deb -name 'EzyView_*.deb' | sort | tail -1)"
      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Linux-only on every push: the visual baselines are a local tool, and
  # cross-OS smoke runs bill 10x/2x. macOS/Windows smoke runs ride along in
  # release.yml when a tag is cut.
  e2e:
    name: end-to-end smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Only the smoke spec runs here on PRs. The visual baselines are a local tool:
      # they compare rendered pixels, and a runner's font rasteriser is not
      # the same as a developer's, so a CI pixel diff would report a
      # difference that is not one.
      - run: npx playwright test e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-nightly:
    name: visual baselines (manual / nightly)
    runs-on: ubuntu-latest
    # Nightly + manual dispatch only: font raster differs per runner, so this
    # is a signal, not a PR gate. Cron removed (bills minutes daily);
    # schedule it locally or run on demand via Run workflow.
    if: github.event_name == 'workflow_dispatch' && inputs.run_visual == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
